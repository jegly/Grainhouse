[package]
name = "grainhouse"
version = "1.0.1"
description = "Photo editor with film looks, AI effects, Lightroom-style tools and Real-ESRGAN upscaling"
license = "AGPL-3.0-only"
repository = "https://github.com/jegly/grainhouse"
edition = "2024"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_6"], optional = true }
async-channel = { version = "2", optional = true }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
ort = "=2.0.0-rc.15"
rawler = "0.8.0"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1.10.0"
[profile.release]
opt-level = 3
codegen-units = 4

[profile.dev]
opt-level = 2

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw", "dep:async-channel"]

[[bin]]
name = "grainhouse"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "grainhouse-cli"
path = "src/bin/grainhouse-cli.rs"
